services:
  goop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goop
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Image is FROM scratch — no shell, no curl. Probe /healthz and /ready
    # from the orchestrator (k8s, compose external healthcheck) instead.
