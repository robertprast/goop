version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc

  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-naming

issues:
  exclude-dirs:
    - bin
    - tmp
